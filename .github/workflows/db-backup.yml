name: Database backup

on:
  schedule:
    # 02:17 UTC daily — off-peak, avoids the top-of-hour cron rush.
    - cron: "17 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout db-backups branch
        uses: actions/checkout@v5
        with:
          ref: db-backups

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          mkdir -p backups
          docker run --rm postgres:17 pg_dump "$DATABASE_URL" --no-owner --no-privileges \
            | gzip -n > "backups/backup-$(date -u +%F).sql.gz"

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Backup $(date -u +%F)"
            git push origin db-backups
          fi
