name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # Runs with coverage (not plain `npm run test`) so vitest.config.ts's
      # thresholds actually gate the PR - previously coverage was only ever
      # computed locally and could silently drift down over time.
      - run: npm run test:coverage

  # lint/typecheck/tests don't catch a `next build`-only failure (static
  # generation errors, edge-runtime incompatibilities, build-time-only env
  # requirements) - those previously only surfaced when Vercel deployed. No
  # real database is needed: every route is server-rendered on demand (no
  # page in this app is statically prerendered against live data), so these
  # are placeholder values only there to satisfy eager env checks at module
  # load (e.g. src/lib/db.ts), not to open a real connection.
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_build_placeholder
      AUTH_SECRET: ci-build-placeholder-secret
      AUTH_GOOGLE_ID: ci-placeholder
      AUTH_GOOGLE_SECRET: ci-placeholder
      ADMIN_EMAILS: admin@example.com
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build

  # The `secrets` context isn't readable from a job-level `if:`, so whether
  # CI_DATABASE_URL is configured has to be resolved in a step (where
  # `secrets` *is* available) and passed to the e2e job via `outputs`.
  check-e2e-secret:
    runs-on: ubuntu-latest
    outputs:
      has-db: ${{ steps.check.outputs.has-db }}
    steps:
      - id: check
        run: echo "has-db=${{ secrets.CI_DATABASE_URL != '' }}" >> "$GITHUB_OUTPUT"

  # Runs Playwright against a real database, so it only fires once a
  # CI_DATABASE_URL secret is configured - point it at a disposable Neon
  # branch (e.g. a "ci" branch off the project), never at production.
  # --workers=1 because the suite shares one database with no per-test
  # isolation; running specs in parallel would let them collide.
  e2e:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit-tests, check-e2e-secret]
    if: ${{ needs.check-e2e-secret.outputs.has-db == 'true' }}
    env:
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      AUTH_GOOGLE_ID: ci-placeholder
      AUTH_GOOGLE_SECRET: ci-placeholder
      ADMIN_EMAILS: admin@example.com
      E2E_TEST_LOGIN_SECRET: ci-test-login-secret
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=1
